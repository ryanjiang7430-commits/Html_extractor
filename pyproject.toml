[project]
name = "html-text-extractor"
version = "0.1.0"
description = "HTML main-text extraction with simhash-based structure grouping."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["html", "text", "extraction", "simhash"]
authors = [
  { name = "INF" }
]
dependencies = [
  "lxml>=4.9",
  "regex>=2023.0.0",
  "numpy>=1.21",
  "jieba>=0.42",
  "emoji>=2.0",
  "langdetect>=1.0.9",
  "simhash>=2.1",
  "gradio>=4.0"
]

[project.optional-dependencies]
 dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
